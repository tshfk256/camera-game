<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたりでポーズ</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--accent:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--accent:#ff922b}}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{position:relative;width:min(calc(100vw - 24px),calc((100vh - 24px)*4/3))}
@supports(height:100dvh){.wrap{width:min(calc(100vw - 24px),calc((100dvh - 24px)*4/3))}}
.wrap:fullscreen,.wrap:-webkit-full-screen{width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center}
.wrap:fullscreen canvas,.wrap:-webkit-full-screen canvas{width:min(100vw,calc(100vh*4/3));border-radius:0}
canvas{width:100%;height:auto;border-radius:12px;background:#000;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);border-radius:12px;color:#fff;text-align:center;padding:16px}
#msg{line-height:1.7;font-size:clamp(16px,2.8vw,30px)}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:clamp(18px,3vw,30px);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#warn{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#ffe066;font-weight:700;font-size:clamp(16px,3.2vw,36px);text-shadow:0 1px 3px #000}
.ctl{position:absolute;left:8px;bottom:50px;display:flex;gap:8px;z-index:2}
.ctl button{padding:10px 18px;font-size:18px;opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="960" height="720"></canvas>
  <div id="warn"></div>
  <div class="ctl"><button id="fs">⛶ 全画面</button><button id="snd">🔊</button></div>
  <div id="overlay">
    <div id="msg">ふたりで協力するポーズゲーム。<br>カメラの前に2人で横に並び、全身が映る位置まで下がってください。<br>画面に出るお題を、2人でそろえて約1秒キープ!<br><span style="font-size:.6em;opacity:.8">映像は端末内でのみ処理され、外部には送信されません。初回はモデルの読み込みに数秒かかります。</span></div>
    <button id="start">カメラを許可してスタート</button>
  </div>
</div>
<video id="v" playsinline webkit-playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script type="module">
import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ============================================================
   お題の追加はここ(POSES に1つ足すだけ)
   ------------------------------------------------------------
   A = 画面の左にいる人 / B = 画面の右にいる人
   座標は画面基準(x: 左0→右1, y: 上0→下1)。s = 2人の肩幅の平均(距離の基準)。
   関節番号: 0鼻 11左肩 12右肩 13左肘 14右肘 15左手首 16右手首
            23左腰 24右腰 25左膝 26右膝  (左右は「その人から見て」)
   内側の腕 = A:16(右) と B:15(左) / 外側の腕 = A:15(左) と B:16(右)
   fig = お手本の絵 [Aの絵, Bの絵]。lw/rw=左右手首の位置(0-100の枠), lean=体の傾き
   step(text, need, chk, fig) …… 1つのポーズ
   steps:[...] を複数並べると、順番に決めていく連続お題になります
   ============================================================ */
const near=(a,b,s,k)=>Math.hypot(a.x-b.x,a.y-b.y)<k*s;
const lean=(p)=>(p[11].x+p[12].x)/2-(p[23].x+p[24].x)/2;
const down={lw:[37,78],rw:[63,78]};
const step=(text,need,chk,fig)=>({text,need,chk,fig});

const POSES=[
 {name:'ハイタッチ',steps:[step('ハイタッチ',[11,12,15,16],
   (A,B,s)=>near(A[16],B[15],s,.8)&&A[16].y<A[12].y&&B[15].y<B[11].y,
   [{lw:[37,78],rw:[78,10]},{lw:[-22,10],rw:[63,78]}])]},
 {name:'手をつなぐ',steps:[step('手をつなぐ',[11,12,16,15,23,24],
   (A,B,s)=>near(A[16],B[15],s,.8)&&Math.abs(A[16].y-(A[23].y+A[24].y)/2)<.8*s,
   [{lw:[37,78],rw:[78,80]},{lw:[-22,80],rw:[63,78]}])]},
 {name:'ふたりでばんざい',steps:[step('ふたりでばんざい',[11,12,15,16],
   (A,B,s)=>[A,B].every(p=>p[15].y<p[11].y-.5*s&&p[16].y<p[12].y-.5*s),
   [{lw:[32,4],rw:[68,4]},{lw:[32,4],rw:[68,4]}])]},
 {name:'ミラーポーズ',steps:[step('左の人のマネを右の人が鏡写し',[11,12,15,16],
   (A,B,s)=>{const d=(p,i,j)=>(p[i].y-p[j].y)/s;
     const a15=d(A,15,11),a16=d(A,16,12),b15=d(B,15,11),b16=d(B,16,12);
     return Math.abs(a15-b16)<.45&&Math.abs(a16-b15)<.45&&Math.min(a15,a16)<-.4},
   [{lw:[32,4],rw:[63,78]},{lw:[37,78],rw:[68,4]}])]},
 /* フュージョン(ドラゴンボール風・簡易版)。finale:true は最後のお題 */
 {name:'フュージョン',finale:true,limit:25000,steps:[
   step('フュー…',[11,12,23,24],(A,B,s)=>lean(A)<-.25*s&&lean(B)>.25*s,
     [{lean:-10,lw:[8,62],rw:[50,56]},{lean:10,lw:[50,56],rw:[92,62]}]),
   step('ジョン…',[11,12,23,24],(A,B,s)=>lean(A)>.25*s&&lean(B)<-.25*s,
     [{lean:10,lw:[22,60],rw:[62,46]},{lean:-10,lw:[38,46],rw:[78,60]}]),
   step('ハッ!',[11,12,15,16],
     (A,B,s)=>near(A[16],B[15],s,.7)&&Math.abs(A[16].y-A[12].y)<.5*s&&A[15].y<A[11].y-.3*s&&B[16].y<B[12].y-.3*s,
     [{lw:[22,6],rw:[78,38]},{lw:[-22,38],rw:[78,6]}])
 ]}
];
/* ============ お題の追加ここまで ============ */

const W=960,H=720;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),video=$('v');
const overlay=$('overlay'),msg=$('msg'),btn=$('start'),warn=$('warn');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const PAIRS=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const FONT='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';
const COLORS=['rgba(80,255,120,.95)','rgba(90,200,255,.95)'];

function drawFig(f,c,k,ox,oy,col,lw){
  const d=f.lean||0;
  c.save();c.translate(ox,oy);c.scale(k,k);
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  const L=(a,b)=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()};
  const sl=[38+d,36],sr=[62+d,36],hl=[44,80],hr=[56,80];
  c.beginPath();c.arc(50+d*1.4,18,10,0,7);c.stroke();
  L([50+d,28],[50,80]);L(sl,sr);L(sl,f.lw);L(sr,f.rw);L(hl,hr);L(hl,[42,108]);L([42,108],[42,135]);L(hr,[58,108]);L([58,108],[58,135]);
  c.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

let landmarker=null,sm=[null,null],lastTs=-1;
async function init(){
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const model="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numPoses:2});
  try{landmarker=await mk("GPU")}catch(e){landmarker=await mk("CPU")}
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
  video.srcObject=stream;await video.play();
}
function people(res){
  const ps=(res.landmarks||[]).map(l=>l.map(q=>({x:1-q.x,y:q.y,visibility:q.visibility})));
  ps.sort((a,b)=>(a[11].x+a[12].x)-(b[11].x+b[12].x));
  return ps.slice(0,2);
}
function smooth(old,cur){return cur.map((q,i)=>{const o=old&&old[i];return o?{x:o.x+(q.x-o.x)*.5,y:o.y+(q.y-o.y)*.5,visibility:q.visibility}:q})}
const visOK=(p,need)=>need.every(i=>p[i]&&p[i].visibility>.5);

/* 音 */
let voice=true,ac=null;const AC=window.AudioContext||window.webkitAudioContext;
function unlockAudio(){try{ac=ac||new AC();ac.resume()}catch(e){}if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}
function speak(t){if(!voice||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)}
function beep(f){try{ac=ac||new AC();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f||880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.15)}catch(e){}}

/* ゲーム状態 */
let order=[],idx=0,st=0,score=0,playing=false,hold=0,poseStart=0,lastT=0,flash=0;
const HOLD_NEED=900,DEFAULT_LIMIT=15000;
const cur=()=>order[idx].steps[st];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){
  const main=shuffle(POSES.filter(p=>!p.finale)),fin=POSES.filter(p=>p.finale);
  order=main.concat(fin);idx=0;score=0;playing=true;overlay.style.display='none';startPose();
}
function startPose(){
  if(idx>=order.length){finish();return}
  st=0;hold=0;poseStart=performance.now();speak(cur().text);
}
function finish(){
  playing=false;
  msg.innerHTML='クリア!チームスコア: <b style="font-size:1.8em">'+score+'</b> 点';
  btn.textContent='もう一度';btn.disabled=false;overlay.style.display='flex';
}
function hud(left){
  const P=order[idx],S=cur();
  ctx.save();ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,170);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 36px '+FONT;
  ctx.fillText('SCORE '+score+'  '+(idx+1)+'/'+order.length,20,32);
  const sec=Math.ceil(left/1000);
  ctx.textAlign='right';ctx.fillStyle=sec<=3?'#ff6b6b':'#fff';ctx.font='bold 44px '+FONT;
  ctx.fillText('残り '+sec+' 秒',W-20,32);
  if(P.steps.length>1){ctx.textAlign='center';ctx.fillStyle='#9be7ff';ctx.font='bold 30px '+FONT;ctx.fillText(P.name+' ('+(st+1)+'/'+P.steps.length+')',W/2,32)}
  ctx.textAlign='center';ctx.fillStyle='#ffe066';
  let fs=88;ctx.font='bold '+fs+'px '+FONT;
  while(ctx.measureText(S.text).width>W-40&&fs>36){fs-=4;ctx.font='bold '+fs+'px '+FONT}
  ctx.fillText(S.text,W/2,108);
  ctx.fillStyle='rgba(255,255,255,.88)';rr(W-345,185,325,270,24);ctx.fill();
  drawFig(S.fig[0],ctx,1.5,W-335,205,'#111',5);
  drawFig(S.fig[1],ctx,1.5,W-185,205,'#c2410c',5);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle=hold>0?'#51cf66':'#ff922b';ctx.fillRect(0,H-40,W*hold/HOLD_NEED,40);
  ctx.restore();
}

function loop(now){
  requestAnimationFrame(loop);
  if(!landmarker||video.readyState<2)return;
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);ctx.restore();
  if(video.currentTime!==lastTs){
    lastTs=video.currentTime;
    const ps=people(landmarker.detectForVideo(video,now));
    sm=[0,1].map(i=>ps[i]?smooth(sm[i],ps[i]):null);
  }
  sm.forEach((p,i)=>{
    if(!p)return;
    ctx.strokeStyle=COLORS[i];ctx.lineWidth=7;ctx.lineCap='round';
    for(const [a,b] of PAIRS){if(p[a].visibility<.4||p[b].visibility<.4)continue;
      ctx.beginPath();ctx.moveTo(p[a].x*W,p[a].y*H);ctx.lineTo(p[b].x*W,p[b].y*H);ctx.stroke()}
    ctx.fillStyle='#fff';
    for(let k=0;k<33;k++){if(p[k].visibility<.4)continue;ctx.beginPath();ctx.arc(p[k].x*W,p[k].y*H,6,0,7);ctx.fill()}
  });
  const dt=now-lastT;lastT=now;
  if(playing){
    const P=order[idx],S=cur(),A=sm[0],B=sm[1];
    const ready=A&&B&&visOK(A,S.need)&&visOK(B,S.need);
    let ok=false;
    if(ready){const s=(dist(A[11],A[12])+dist(B[11],B[12]))/2;if(s>.03)ok=S.chk(A,B,s)}
    warn.textContent=!(A&&B)?'2人とも映るように、横に並んで位置を調整してください':(ready?'':'必要な体の部分(手・腰など)が映るよう調整してください');
    hold=ok?Math.min(HOLD_NEED,hold+dt):Math.max(0,hold-dt*2);
    const left=Math.max(0,(P.limit||DEFAULT_LIMIT)-(now-poseStart));
    hud(left);
    if(hold>=HOLD_NEED){
      flash=15;beep(st<P.steps.length-1?660:880);
      if(st<P.steps.length-1){st++;hold=0;speak(cur().text)}
      else{score+=100+Math.round(left/100);idx++;startPose()}
    }else if(left<=0){idx++;startPose()}
  }else warn.textContent='';
  if(flash>0){flash--;ctx.fillStyle='rgba(255,224,102,'+(flash/30)+')';ctx.fillRect(0,0,W,H)}
}

btn.addEventListener('click',async()=>{
  unlockAudio();
  if(landmarker){begin();return}
  btn.disabled=true;btn.textContent='読み込み中…';
  try{await init();btn.disabled=false;begin()}
  catch(e){btn.disabled=false;btn.textContent='もう一度試す';
    msg.textContent='起動できませんでした。カメラの許可とネット接続を確認してください。('+(e&&e.name?e.name:'error')+')'}
});
$('fs').onclick=()=>{const w=document.querySelector('.wrap');const fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const f=w.requestFullscreen||w.webkitRequestFullscreen;if(f)f.call(w)}};
$('snd').onclick=()=>{voice=!voice;$('snd').textContent=voice?'🔊':'🔇';if(!voice)speechSynthesis.cancel()};
requestAnimationFrame(loop);
</script>
</body>
</html>

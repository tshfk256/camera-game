<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空中お絵かき クイズ&いのち</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--accent:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--accent:#ff922b}}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{position:relative;width:min(calc(100vw - 24px),calc((100vh - 24px)*4/3))}
@supports(height:100dvh){.wrap{width:min(calc(100vw - 24px),calc((100dvh - 24px)*4/3))}}
.wrap:fullscreen,.wrap:-webkit-full-screen{width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center}
.wrap:fullscreen canvas,.wrap:-webkit-full-screen canvas{width:min(100vw,calc(100vh*4/3));border-radius:0}
canvas{width:100%;height:auto;border-radius:12px;background:#000;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.7);border-radius:12px;color:#fff;text-align:center;padding:16px}
#msg{line-height:1.8;font-size:clamp(14px,2.4vw,26px)}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:clamp(18px,3vw,30px);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.ctl{position:absolute;left:8px;bottom:50px;z-index:2}
.ctl button{padding:8px 16px;font-size:16px;opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="960" height="720"></canvas>
  <div class="ctl"><button id="fs">⛶ 全画面</button></div>
  <div id="overlay">
    <div id="msg">手で空中にお絵かき!<br>👌 親指と人差し指をくっつける(ピンチ)と描けます。<br>上のボタンには、手をかざして約1秒で選べます。<br>❓ お絵描きクイズ(全5問・1問60秒): お題が出たら、描く人だけ見て、みんなで当てよう。<br>🐾 描いた絵が動物のように動き出します。<br><span style="font-size:.6em;opacity:.8">映像は端末内でのみ処理され、外部には送信されません。初回はモデルの読み込みに数秒かかります。<br>キーボード: Z=元に戻す / C=全消し / S=保存</span></div>
    <button id="start">カメラを許可してスタート</button>
  </div>
</div>
<video id="v" playsinline webkit-playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const W=960,H=720,TB=82,BS=54,GAP=6;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),video=$('v');
const layer=document.createElement('canvas');layer.width=W;layer.height=H;
const lx=layer.getContext('2d',{willReadFrequently:true});
const overlay=$('overlay'),msg=$('msg'),btn=$('start');
const FONT='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';

/* お題リスト(ここに足すだけで増やせます) */
const TOPICS=['ねこ','いぬ','さかな','とり','うさぎ','ぞう','ペンギン','かめ','ちょう','ライオン','りんご','バナナ','くるま','いえ','おはな','にじ','ロケット','たいよう','ひこうき','ケーキ','き','かさ'];
const ROUNDS=5,LIMIT=60000;

/* ボタン */
const COLORS=['#e03131','#f08c00','#2f9e44','#1971c2','#9c36b5','#212529'];
const BTNS=[...COLORS.map(c=>({k:'color',color:c})),
 {k:'size',v:8,label:'細'},{k:'size',v:20,label:'太'},
 {k:'eraser',label:'🧽'},{k:'undo',label:'↩'},{k:'clear',label:'🗑'},{k:'bg',label:'🎥'},{k:'save',label:'💾'},
 {k:'quiz',label:'❓'},{k:'anim',label:'🐾'}];
const ANIM_BTNS=[{k:'back',label:'✏️',t:'もどる'},{k:'mv',v:'walk',label:'🚶',t:'歩く'},{k:'mv',v:'hop',label:'🐸',t:'跳ねる'},
 {k:'mv',v:'swim',label:'🐟',t:'泳ぐ'},{k:'mv',v:'fly',label:'🕊️',t:'飛ぶ'},{k:'rx',v:'flee',label:'🏃',t:'にげる'},{k:'rx',v:'chase',label:'🧲',t:'追う'}];
const QBTNS=[{k:'qok',label:'⭕',t:'正解!',x:W-130,y:190,w:110,h:84},{k:'qpass',label:'⏭',t:'パス',x:W-130,y:290,w:110,h:84}];
function layoutRow(a){const x0=(W-a.length*(BS+GAP)+GAP)/2;a.forEach((b,i)=>{b.x=x0+i*(BS+GAP);b.y=14;b.w=BS;b.h=BS})}
layoutRow(BTNS);layoutRow(ANIM_BTNS);

let color=COLORS[0],size=8,eraser=false,camBg=true,undoStack=[];
let mode='draw',mv='walk',rx='none',creatures=[],toast={t:'',until:0};
const quiz={state:'off',topic:'',t0:0,round:0,score:0,pts:0,res:'',list:[]};

function snap(){undoStack.push(lx.getImageData(0,0,W,H));if(undoStack.length>10)undoStack.shift()}
function undo(){const s=undoStack.pop();if(s)lx.putImageData(s,0,0)}
function clearAll(){snap();lx.clearRect(0,0,W,H)}
function save(){const t=document.createElement('canvas');t.width=W;t.height=H;const c=t.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,W,H);c.drawImage(layer,0,0);
  const a=document.createElement('a');a.download='air-drawing.png';a.href=t.toDataURL('image/png');a.click()}
const say=(t,ms)=>{toast={t,until:performance.now()+(ms||2200)}};

/* 音 */
let ac=null;const AC=window.AudioContext||window.webkitAudioContext;
function beep(f){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f||880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.15)}catch(e){}}

/* ===== クイズ ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){quiz.list=shuffle(TOPICS.slice());quiz.round=0;quiz.score=0;nextRound()}
function nextRound(){quiz.topic=quiz.list[quiz.round];quiz.state='reveal';quiz.t0=performance.now();lx.clearRect(0,0,W,H);undoStack=[]}
function endRound(res){
  if(res==='ok'){const left=Math.max(0,LIMIT-(performance.now()-quiz.t0));quiz.pts=10+Math.ceil(left/6000);quiz.score+=quiz.pts;beep(880)}
  else beep(330);
  quiz.res=res;quiz.state='result';quiz.t0=performance.now();
}
function quizTick(){
  const now=performance.now(),q=quiz;
  if(q.state==='reveal'&&now-q.t0>3500){q.state='draw';q.t0=now;beep(660)}
  else if(q.state==='draw'&&now-q.t0>=LIMIT)endRound('time');
  else if(q.state==='result'&&now-q.t0>3000){q.round++;if(q.round>=ROUNDS){q.state='end';q.t0=now;beep(990)}else nextRound()}
  else if(q.state==='end'&&now-q.t0>5000)q.state='off';
}

/* ===== 命を吹き込む ===== */
function buildCreatures(){
  const S=4,gw=W/S,gh=H/S,data=lx.getImageData(0,0,W,H).data;
  const m=new Uint8Array(gw*gh);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
    let on=0;
    for(let y=0;y<S&&!on;y++)for(let x=0;x<S;x++){if(data[((gy*S+y)*W+gx*S+x)*4+3]>10){on=1;break}}
    m[gy*gw+gx]=on;
  }
  const R=3,dl=new Uint8Array(gw*gh);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++)if(m[gy*gw+gx])
    for(let y=Math.max(0,gy-R);y<=Math.min(gh-1,gy+R);y++)for(let x=Math.max(0,gx-R);x<=Math.min(gw-1,gx+R);x++)dl[y*gw+x]=1;
  const lab=new Int16Array(gw*gh);let n=0;const comps=[];
  for(let i=0;i<gw*gh;i++){
    if(!dl[i]||lab[i])continue;
    n++;const st=[i];lab[i]=n;const c={id:n,cells:0,x0:gw,y0:gh,x1:0,y1:0};
    while(st.length){const p=st.pop(),px=p%gw,py=(p/gw)|0;
      if(m[p]){c.cells++;c.x0=Math.min(c.x0,px);c.x1=Math.max(c.x1,px);c.y0=Math.min(c.y0,py);c.y1=Math.max(c.y1,py)}
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const qx=px+dx,qy=py+dy;
        if(qx<0||qy<0||qx>=gw||qy>=gh)continue;const qi=qy*gw+qx;if(dl[qi]&&!lab[qi]){lab[qi]=n;st.push(qi)}}}
    comps.push(c);
  }
  const list=comps.filter(c=>c.cells>=8).sort((a,b)=>b.cells-a.cells).slice(0,8);
  return list.map(c=>{
    const x0=c.x0*S,y0=c.y0*S,w=(c.x1-c.x0+1)*S,h=(c.y1-c.y0+1)*S;
    const sp=document.createElement('canvas');sp.width=w;sp.height=h;const sc=sp.getContext('2d');
    const img=lx.getImageData(x0,y0,w,h),d=img.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(lab[((y0+y)>>2)*gw+((x0+x)>>2)]!==c.id)d[(y*w+x)*4+3]=0}
    sc.putImageData(img,0,0);
    let spr=sp,sw=w,sh=h;const k=Math.min(1,300/Math.max(w,h));
    if(k<1){sw=Math.max(8,Math.round(w*k));sh=Math.max(8,Math.round(h*k));spr=document.createElement('canvas');spr.width=sw;spr.height=sh;spr.getContext('2d').drawImage(sp,0,0,sw,sh)}
    return {spr,w:sw,h:sh,x:x0+w/2,y:y0+h/2,vx:(Math.random()<.5?-1:1)*(1.2+Math.random()),vy:0,jy:0,jv:0,sq:0,jt:Math.random()*40,phase:Math.random()*6,face:1};
  });
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const GROUND=H-62;
function step(c,f,pens){
  c.phase+=.06*f;
  let ax=0,ay=0;
  if(rx!=='none')for(const p of pens){const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)+1;
    if(d<320){const k=(320-d)/320*(rx==='flee'?1:-1);ax+=dx/d*k;ay+=dy/d*k}}
  const groundY=GROUND-c.h/2;
  if(mv==='walk'||mv==='hop'){
    c.vx=clamp(c.vx+ax*.4*f,-4.5,4.5);if(Math.abs(c.vx)<.8)c.vx=.8*(Math.sign(c.vx)||1);
    c.x+=c.vx*f;
    if(mv==='hop'){
      c.jt-=f;
      if(c.jy===0&&c.jt<=0){c.jv=-13;c.jt=30+Math.random()*30}
      if(c.jy<0||c.jv<0){c.jv+=.9*f;c.jy+=c.jv*f;if(c.jy>=0){c.jy=0;c.jv=0;c.sq=1}}
      c.sq*=Math.pow(.85,f);
    }
    c.y+=(groundY+c.jy-c.y)*Math.min(1,.15*f);
  }else{
    c.vx=clamp(c.vx+ax*.35*f,-4,4);if(Math.abs(c.vx)<.8)c.vx=.8*(Math.sign(c.vx)||1);
    c.vy=clamp(c.vy*Math.pow(.98,f)+ay*.35*f+Math.sin(c.phase*.7)*.04*f,-3,3);
    c.x+=c.vx*f;c.y+=c.vy*f+(mv==='fly'?Math.sin(c.phase*3)*.8*f:0);
    c.y=clamp(c.y,TB+c.h/2+6,GROUND-c.h/2);
    c.jy=0;c.jv=0;c.sq=0;
  }
  if(c.x<c.w/2){c.x=c.w/2;c.vx=Math.abs(c.vx)}
  else if(c.x>W-c.w/2){c.x=W-c.w/2;c.vx=-Math.abs(c.vx)}
  c.face=c.vx>=0?1:-1;
}
function drawCreature(c){
  let rot=0,sx=1,sy=1,bob=0,warp=null;
  if(mv==='walk'){rot=Math.sin(c.phase*6)*.07;sy=1+.03*Math.sin(c.phase*12);bob=-Math.abs(Math.sin(c.phase*6))*10}
  else if(mv==='hop'){sx=1+.2*c.sq-(c.jy<0?.05:0);sy=1-.25*c.sq+(c.jv<0?.1:0)}
  else if(mv==='swim'){rot=c.vy*.03;const a=Math.min(10,c.h*.08);warp=u=>Math.sin(c.phase*6-u*5)*a}
  else{rot=c.vy*.03;const a=c.h*.25;warp=u=>-Math.abs(u)*Math.sin(c.phase*10)*a}
  if(mv==='walk'||mv==='hop'){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(c.x,GROUND+4,c.w*.35,8,0,0,7);ctx.fill()}
  ctx.save();ctx.translate(c.x,c.y+bob);ctx.rotate(rot);ctx.scale(c.face*sx,sy);
  if(!warp)ctx.drawImage(c.spr,-c.w/2,-c.h/2);
  else for(let i=0;i<c.w;i+=6){const sw=Math.min(6,c.w-i),u=(i+sw/2)/c.w*2-1;ctx.drawImage(c.spr,i,0,sw,c.h,-c.w/2+i,-c.h/2+warp(u),sw+.5,c.h)}
  ctx.restore();
}

/* ===== ボタン操作 ===== */
function act(b){
  switch(b.k){
    case 'color':color=b.color;eraser=false;break;
    case 'size':size=b.v;break;
    case 'eraser':eraser=!eraser;break;
    case 'undo':undo();break;
    case 'clear':clearAll();break;
    case 'bg':camBg=!camBg;break;
    case 'save':save();break;
    case 'quiz':if(quiz.state==='off')startQuiz();else quiz.state='off';break;
    case 'anim':
      if(quiz.state!=='off'){say('クイズ中は使えません(❓で終了)');break}
      creatures=buildCreatures();
      if(!creatures.length){say('先に絵を描いてね');break}
      mode='animate';beep(660);break;
    case 'back':mode='draw';break;
    case 'mv':mv=b.v;break;
    case 'rx':rx=(rx===b.v)?'none':b.v;break;
    case 'qok':if(quiz.state==='draw')endRound('ok');break;
    case 'qpass':if(quiz.state==='draw')endRound('pass');break;
  }
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='z')undo();else if(k==='c')clearAll();else if(k==='s')save()});
function curButtons(){
  if(mode==='animate')return ANIM_BTNS;
  if(quiz.state==='reveal'||quiz.state==='result'||quiz.state==='end')return [];
  return quiz.state==='draw'?BTNS.concat(QBTNS):BTNS;
}
const isActive=b=>(b.k==='color'&&!eraser&&color===b.color)||(b.k==='size'&&size===b.v)||(b.k==='eraser'&&eraser)||(b.k==='bg'&&!camBg)||(b.k==='quiz'&&quiz.state!=='off')||(b.k==='mv'&&mv===b.v)||(b.k==='rx'&&rx===b.v);

/* ===== 手の検出 ===== */
let landmarker=null,lastTs=-1;
async function init(){
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const model="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const mk=d=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numHands:2});
  try{landmarker=await mk("GPU")}catch(e){landmarker=await mk("CPU")}
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
  video.srcObject=stream;await video.play();
}
const hands=[0,1].map(()=>({pen:null,pinch:false,last:null,dw:{b:null,t:0,fired:false}}));
const DWELL=800;
const px=(l,i)=>({x:(1-l[i].x)*W,y:l[i].y*H});
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function updateHands(res,dt){
  const ls=(res.landmarks||[]).map(l=>{const t=px(l,4),i8=px(l,8),sz=D(px(l,0),px(l,9));
    return {mid:{x:(t.x+i8.x)/2,y:(t.y+i8.y)/2},ratio:D(t,i8)/Math.max(sz,1)}}).sort((a,b)=>a.mid.x-b.mid.x).slice(0,2);
  const btns=curButtons(),drawOK=mode==='draw'&&(quiz.state==='off'||quiz.state==='draw');
  hands.forEach((h,i)=>{
    const d=ls[i];
    if(!d){h.pen=null;h.pinch=false;h.last=null;h.dw={b:null,t:0,fired:false};return}
    h.pen=h.pen?{x:h.pen.x+(d.mid.x-h.pen.x)*.55,y:h.pen.y+(d.mid.y-h.pen.y)*.55}:d.mid;
    const was=h.pinch;h.pinch=was?d.ratio<.5:d.ratio<.3;
    const hit=btns.find(b=>h.pen.x>b.x-6&&h.pen.x<b.x+b.w+6&&h.pen.y>b.y-6&&h.pen.y<b.y+b.h+6)||null;
    if(drawOK&&h.pinch&&!hit&&h.pen.y>=TB){
      lx.save();lx.globalCompositeOperation=eraser?'destination-out':'source-over';
      lx.strokeStyle=lx.fillStyle=color;lx.lineCap=lx.lineJoin='round';
      const w=eraser?60:size;lx.lineWidth=w;
      if(!was||!h.last){snap();lx.beginPath();lx.arc(h.pen.x,h.pen.y,w/2,0,7);lx.fill()}
      else{lx.beginPath();lx.moveTo(h.last.x,h.last.y);lx.lineTo(h.pen.x,h.pen.y);lx.stroke()}
      lx.restore();h.last={x:h.pen.x,y:h.pen.y};
    }else h.last=null;
    const target=(!h.pinch&&hit)?hit:null;
    if(target!==h.dw.b)h.dw={b:target,t:0,fired:false};
    else if(target&&!h.dw.fired){h.dw.t+=dt;if(h.dw.t>=DWELL){h.dw.fired=true;act(target)}}
  });
}

/* ===== 描画 ===== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(t,x,y,sz,col,al){ctx.font='bold '+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(4,sz/8);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function drawBtn(b){
  ctx.fillStyle=b.k==='color'?b.color:b.k==='qok'?'#8ce99a':b.k==='qpass'?'#ced4da':'#f1f3f5';rr(b.x,b.y,b.w,b.h,14);ctx.fill();
  if(isActive(b)){ctx.lineWidth=6;ctx.strokeStyle='#ffe066';ctx.stroke()}
  ctx.fillStyle='#212529';ctx.textAlign='center';ctx.textBaseline='middle';
  if(b.label){
    const lb=b.k==='bg'?(camBg?'🎥':'⬜'):(b.k==='quiz'&&quiz.state!=='off'?'✖':b.label);
    ctx.font=(b.t?'bold 28px ':'bold 30px ')+FONT;ctx.fillText(lb,b.x+b.w/2,b.y+b.h/2+(b.t?-8:2));
  }
  if(b.t){ctx.font='bold '+(b.h>60?20:13)+'px '+FONT;ctx.fillText(b.t,b.x+b.w/2,b.y+b.h-(b.h>60?14:9))}
  if(b.k==='size'){ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h-12,b.v/2.5,0,7);ctx.fill()}
}
function drawUI(){
  const btns=curButtons();
  if(btns.length){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,TB)}
  btns.forEach(drawBtn);
  hands.forEach(h=>{const b=h.dw.b;if(b&&!h.dw.fired&&h.dw.t>0){
    ctx.strokeStyle='#51cf66';ctx.lineWidth=8;ctx.beginPath();
    ctx.arc(b.x+b.w/2,b.y+b.h/2,Math.max(b.w,b.h)/2+6,-Math.PI/2,-Math.PI/2+Math.PI*2*h.dw.t/DWELL);ctx.stroke()}});
}
function drawCursors(){
  hands.forEach(h=>{if(!h.pen)return;
    const r=(mode==='animate')?16:(eraser?30:Math.max(12,size/2+6));
    ctx.lineWidth=4;ctx.strokeStyle=eraser&&mode==='draw'?'#fff':color;ctx.fillStyle=eraser&&mode==='draw'?'rgba(255,255,255,.4)':color;
    ctx.beginPath();ctx.arc(h.pen.x,h.pen.y,r,0,7);if(h.pinch&&mode==='draw')ctx.fill();ctx.stroke();
    ctx.lineWidth=2;ctx.strokeStyle='#000';ctx.beginPath();ctx.arc(h.pen.x,h.pen.y,r+3,0,7);ctx.stroke()});
}
function banner(lines,col){
  ctx.fillStyle='rgba(0,0,0,.72)';rr(120,230,W-240,250,28);ctx.fill();
  lines.forEach(([t,sz,c],i)=>txt(t,W/2,300+i*(i?85:0)+(i?20:0),sz,c||col));
}
function drawQuiz(){
  const q=quiz,now=performance.now();
  if(q.state==='reveal'){
    ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(0,0,W,H);
    txt('第'+(q.round+1)+'問 / '+ROUNDS,W/2,120,44,'#9be7ff');
    txt('お題',W/2,215,48,'#fff');
    txt(q.topic,W/2,350,150,'#ffe066');
    txt('描く人だけ見てね!みんなは目をつぶって!',W/2,490,40,'#fff');
    txt(String(Math.max(1,Math.ceil((3500-(now-q.t0))/1000))),W/2,600,90,'#ff922b');
  }else if(q.state==='draw'){
    const left=Math.max(0,LIMIT-(now-q.t0)),sec=Math.ceil(left/1000);
    txt('第'+(q.round+1)+'/'+ROUNDS+'問  SCORE '+q.score,20,TB+34,34,'#fff','left');
    txt('残り '+sec+' 秒',W-20,TB+34,44,sec<=10?'#ff6b6b':'#fff','right');
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H-44,W,44);
    txt('描いて、みんなでお題を当てよう!当たったら ⭕ に手をかざす',W/2,H-22,24,'#fff');
  }else if(q.state==='result'){
    if(q.res==='ok')banner([['正解!  +'+q.pts+'点',90,'#8ce99a'],['お題は「'+q.topic+'」',54,'#fff']]);
    else banner([[q.res==='time'?'時間切れ…':'パス',80,'#ff8787'],['お題は「'+q.topic+'」でした',54,'#fff']]);
  }else if(q.state==='end'){
    banner([['おつかれさま!',80,'#ffe066'],['合計 '+q.score+' 点',90,'#8ce99a']]);
  }
}

let lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!landmarker||video.readyState<2)return;
  const dt=Math.min(100,now-lastT);lastT=now;
  if(quiz.state!=='off')quizTick();
  if(camBg){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);ctx.restore();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(0,0,W,H)}
  else{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}
  if(video.currentTime!==lastTs){lastTs=video.currentTime;updateHands(landmarker.detectForVideo(video,now),dt)}
  const pens=hands.filter(h=>h.pen).map(h=>h.pen);
  if(mode==='animate'){
    const f=dt/16.7;creatures.forEach(c=>{step(c,f,pens);drawCreature(c)});
  }else if(quiz.state!=='reveal')ctx.drawImage(layer,0,0);
  drawUI();drawCursors();
  if(mode==='animate'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H-44,W,44);
    txt('動き: '+({walk:'歩く',hop:'跳ねる',swim:'泳ぐ',fly:'飛ぶ'})[mv]+'   反応: '+({none:'なし',flee:'にげる',chase:'追いかける'})[rx]+'  (手を近づけてみよう)',W/2,H-22,24,'#fff');
  }else if(quiz.state==='off'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H-44,W,44);
    txt(pens.length?'ピンチ(親指+人差し指)で描く / ❓クイズ / 🐾動かす':'手をカメラに映してください',W/2,H-22,24,'#fff');
  }
  quiz.state!=='reveal'&&drawQuizOverlayAfter();
  if(quiz.state==='reveal')drawQuiz();
  if(toast.until>performance.now())txt(toast.t,W/2,H/2,48,'#ffe066');
}
function drawQuizOverlayAfter(){if(quiz.state!=='off')drawQuiz()}

btn.addEventListener('click',async()=>{
  try{ac=ac||new AC();ac.resume()}catch(e){}
  if(landmarker){overlay.style.display='none';return}
  btn.disabled=true;btn.textContent='読み込み中…';
  try{await init();overlay.style.display='none'}
  catch(e){btn.disabled=false;btn.textContent='もう一度試す';
    msg.textContent='起動できませんでした。カメラの許可とネット接続を確認してください。('+(e&&e.name?e.name:'error')+')'}
});
$('fs').onclick=()=>{const w=document.querySelector('.wrap');const fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const f=w.requestFullscreen||w.webkitRequestFullscreen;if(f)f.call(w)}};
requestAnimationFrame(loop);
</script>

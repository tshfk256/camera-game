<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーズビームバトル</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--accent:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f7;--accent:#ff922b}}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{position:relative;width:min(calc(100vw - 24px),calc((100vh - 24px)*4/3))}
@supports(height:100dvh){.wrap{width:min(calc(100vw - 24px),calc((100dvh - 24px)*4/3))}}
.wrap:fullscreen,.wrap:-webkit-full-screen{width:100vw;height:100vh;background:#000;display:flex;align-items:center;justify-content:center}
.wrap:fullscreen canvas,.wrap:-webkit-full-screen canvas{width:min(100vw,calc(100vh*4/3));border-radius:0}
canvas{width:100%;height:auto;border-radius:12px;background:#000;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.72);border-radius:12px;color:#fff;text-align:center;padding:16px}
#msg{line-height:1.8;font-size:clamp(14px,2.4vw,26px)}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:clamp(18px,3vw,30px);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.row button{padding:8px 18px;font-size:clamp(15px,2.4vw,24px);background:#495057}
.row button.on{background:var(--accent)}
.ctl{position:absolute;left:8px;bottom:50px;z-index:2}
.ctl button{padding:8px 16px;font-size:16px;opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="960" height="720"></canvas>
  <div class="ctl"><button id="fs">⛶ 全画面</button></div>
  <div id="overlay">
    <div id="msg"><b style="font-size:1.5em">🔥 ポーズビームバトル</b><br>好きな技を選んで、順番に1人ずつ撃ち、敵に与えたダメージの合計を競います(全3ラウンド)。<br>① 技の「構え」で溜める → 光の玉が育つ ② 「発射」のポーズ!<br>構え・溜め・速さ・ポーズの正確さで威力が決まります。ラストヒットには +300点!<br>⚡ 変身ポーズをキープすると、超サイヤ人・界王拳・身勝手の極意に変身して、ダメージが大きくアップ!<br><span style="font-size:.6em;opacity:.8">体(腰から上)が全部映る位置に立ってください。映像は端末内でのみ処理され、外部には送信されません。<br>テスト用: スペースキーで強制発射</span></div>
    <div class="row"><span>人数:</span><button class="pc on" data-n="2">2人</button><button class="pc" data-n="3">3人</button><button class="pc" data-n="4">4人</button></div>
    <div class="row" id="techs"><span>技:</span></div>
    <div class="row"><button id="mic">🎤 声の大きさもダメージに加える: OFF</button><button id="fm" class="on">⚡ 変身要素: ON</button><button id="hm">💇 髪: リアル色変え</button></div>
    <button id="start">カメラを許可してスタート</button>
  </div>
</div>
<video id="v" playsinline webkit-playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<script type="module">
import {PoseLandmarker,ImageSegmenter,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const W=960,H=720;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),video=$('v');
const overlay=$('overlay'),msg=$('msg'),btn=$('start');
const FONT='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';
const PCOLORS=['#ff6b6b','#4dabf7','#69db7c','#ffd43b'];
const ROUNDS=3,TURN_LIMIT=15000,INTRO=3500,BEAM_MS=1000,RESULT_MS=3200;
/* 敵の画像を使いたいとき: 同じフォルダに画像を置き、ファイル名をここに書く(例: ['e1.png','e2.png','e3.png'])。空なら内蔵のオリジナル敵を使います */
const ENEMY_IMAGES=[];
const ENEMIES=['スライムキング','メカゾイド','ウチュウ星人'];
const EX=W-190,EY=H*.52;
const imgs=ENEMY_IMAGES.map(u=>{const i=new Image();i.src=u;return i});

/* ===== 技の定義(ここに足すだけで技を増やせます) =====
 eval(m,ts) が下の値を返します。m は現在の体の測定値、ts は技ごとの一時メモ(ターンごとにリセット)。
  m.p=関節(座標は画面基準 左0→右1/上0→下1) m.sw=肩幅 m.sm=肩の中点 m.hm=腰の中点 m.wm=両手首の中点 m.nose=鼻
  m.d=両手首の距離 m.speed=両手の移動の速さ m.vy=下向きの速さ m.zFwd=前への突き出し m.sp15/m.sp16=各手首の速さ m.spread=両手の開く速さ
  (距離はすべて肩幅=1 の比率。速さは約0.3秒あたり)
 返す値: valid=溜めの構えができている / q=構えの出来(0-1) / hint=直すヒント / thrust=発射の動作をした
         fq=発射時の出来2つ(名前は qn) / spd=速さ(0-1) / orb=光の玉の位置(0-1)
 fig=お手本の絵 [構え, 発射] (lw/rw=左右の手首の位置, 0-100の枠) */
const GLOW=(g,m,e,b)=>({glow:g,mid:m,edge:e,beam:b});
const TECHNIQUES=[
 {id:'kame',name:'かめはめ波',shout:'かめはめ波ー!',desc:'両手を腰の横に引いて構え → 両手をそろえて前へ突き出す',qn:['そろい','高さ'],orbScale:1,
  col:GLOW('#74c0fc','#a5d8ff','rgba(77,171,247,0)','rgba(77,171,247,.65)'),
  fig:[{lw:[22,78],rw:[28,82]},{lw:[46,40],rw:[54,40]}],
  eval:(m)=>{const {sw,sm,hm,wm,d,p}=m;
   const together=1-clamp(d/(.9*sw),0,1),side=clamp(Math.abs(wm.x-hm.x)/(.9*sw),0,1);
   const inH=wm.y>sm.y+.3*sw&&wm.y<hm.y+.5*sw;
   let knee=.5;if(vis(p,[25,26])){const kh=((p[25].y+p[26].y)/2-hm.y)/sw;knee=clamp((1.2-kh)/.5,0,1)}
   const valid=together>.25&&side>.35&&inH;
   const chest=Math.abs(wm.y-sm.y)<.7*sw,cen=Math.abs(wm.x-sm.x)<.9*sw;
   return {valid,q:.4*together+.3*side+.3*knee,
    hint:valid?'':(together<=.25?'両手をくっつけて!':(side<=.35?'手を腰の横に引いて!':'手の高さを腰のあたりに')),
    thrust:chest&&cen&&d<.9*sw&&(m.speed>.9||m.zFwd>1),
    fq:[1-clamp(d/(.9*sw),0,1),1-clamp(Math.abs(wm.y-sm.y)/(.8*sw),0,1)],
    spd:clamp(Math.max(m.speed/1.5,m.zFwd/1.5),0,1),orb:wm}}},
 {id:'genki',name:'元気玉',shout:'げんきだまー!',desc:'両手を頭の上に高く上げて溜める → 両手を一気に振り下ろす',qn:['そろい','勢い'],orbScale:1.5,
  col:GLOW('#ffa94d','#ffe8cc','rgba(255,146,43,0)','rgba(255,146,43,.65)'),
  fig:[{lw:[36,0],rw:[64,0]},{lw:[44,66],rw:[56,66]}],
  eval:(m)=>{const {sw,nose,wm,p,d}=m;
   const up=clamp((nose.y-wm.y)/sw,0,1),sym=1-clamp(Math.abs(p[15].y-p[16].y)/(.6*sw),0,1);
   const valid=p[15].y<nose.y-.2*sw&&p[16].y<nose.y-.2*sw;
   return {valid,q:.6*up+.4*sym,hint:valid?'':'両手を頭の上に高く上げて!',
    thrust:m.vy>1.0&&wm.y>nose.y-.1*sw,
    fq:[1-clamp(d/(1.2*sw),0,1),clamp(m.vy/2,0,1)],spd:clamp(m.vy/2,0,1),
    orb:{x:wm.x,y:Math.min(wm.y,nose.y-.2*sw)}}}},
 {id:'two',name:'ツーフィンガービーム',shout:'ビーム!',desc:'片手を額に当て、もう片方の腕を真横に伸ばして構え → 額の手を突き出す',qn:['のび','ねらい'],orbScale:.6,
  col:GLOW('#ffd43b','#fff3bf','rgba(250,176,5,0)','rgba(250,176,5,.65)'),
  fig:[{lw:[8,36],rw:[52,12]},{lw:[8,36],rw:[88,26]}],
  eval:(m,ts)=>{const {sw,sm,nose,p}=m;
   const d15=dist(p[15],nose)/sw,d16=dist(p[16],nose)/sw;
   const hi=d15<d16?15:16,ot=hi===15?16:15,dn=Math.min(d15,d16);
   const oth=Math.abs(p[ot].x-sm.x)/sw,near=dn<.9&&p[hi].y<sm.y,valid=near&&oth>1.1;
   if(valid)ts.hi=hi;
   const h=ts.hi||hi,away=dist(p[h],nose)/sw,sp=h===15?m.sp15:m.sp16;
   return {valid,q:.5*clamp(1-dn/.9,0,1)+.5*clamp((oth-1.1)/.9,0,1),
    hint:valid?'':(!near?'片手を額に当てて!':'もう片方の腕を真横に伸ばして!'),
    thrust:ts.hi!==undefined&&away>1.3&&sp>.9,
    fq:[clamp(away/2,0,1),1-clamp(Math.abs(p[h].y-nose.y)/(.8*sw),0,1)],spd:clamp(sp/2,0,1),orb:p[h]}}},
 {id:'cross',name:'クロスバースト',shout:'クロスバースト!',desc:'両腕を胸の前で交差して溜める → 両腕を左右に思いきり開く',qn:['開き','高さ'],orbScale:1.2,
  col:GLOW('#ff8787','#ffe3e3','rgba(250,82,82,0)','rgba(250,82,82,.65)'),
  fig:[{lw:[58,50],rw:[42,50]},{lw:[2,34],rw:[98,34]}],
  eval:(m)=>{const {sw,sm,hm,wm,p,d}=m;
   const cross=(p[15].x-p[16].x)/sw,chestY=sm.y+(hm.y-sm.y)*.35,level=1-clamp(Math.abs(wm.y-chestY)/(.8*sw),0,1);
   const valid=cross>.15&&level>.2;
   return {valid,q:.6*clamp(cross/.8,0,1)+.4*level,hint:valid?'':(cross<=.15?'両腕を胸の前で交差させて!':'手を胸の高さに'),
    thrust:d>2.2*sw&&m.spread>.8,
    fq:[clamp(d/(3*sw),0,1),1-clamp(Math.abs(wm.y-sm.y)/(.8*sw),0,1)],spd:clamp(m.spread/2,0,1),orb:wm}}}
];
/* ===== 変身の定義(ここに足すだけで変身を増やせます) =====
 ポーズ(1つの「線」)をキープした合計秒数が、tiers の sec を超えるたびに変身します(変身はゲーム中ずっと続きます)。
 tiers: sec=必要な秒数 / mult=ダメージ倍率 / col=オーラの色(RGB) / hair=髪(spiky か long) / hairCol=髪の色 / bolts=稲妻 / size=オーラの大きさ
 chk(m)=そのポーズをとっているか(m は技の定義と同じ測定値。技の構えをとっている間は無効)
 hairBoost=髪を明るくする強さ(0-1、リアル色変え用)。ps=お手本の短い説明。CUMULATIVE=false にすると、ポーズが途切れたら秒数がリセットされます */
const CUMULATIVE=true;
const FORMS=[
 {id:'kaio',ps:'拳を胸で合わせる',name:'界王拳',
  tiers:[{sec:2,name:'界王拳',short:'界',mult:1.3,col:'255,59,48',size:1.3}],
  chk:(m)=>{const {sw,sm,hm,wm,d,p}=m,chestY=sm.y+(hm.y-sm.y)*.3;
   return vis(p,[13,14])&&d<.55*sw&&Math.abs(wm.y-chestY)<.5*sw&&Math.abs(p[13].x-sm.x)>.75*sw&&Math.abs(p[14].x-sm.x)>.75*sw}},
 {id:'ssj',ps:'腰に手(ひじを張る)',name:'超サイヤ人',
  tiers:[{sec:3,name:'超サイヤ人',short:'SS',mult:1.5,col:'255,212,59',hair:'spiky',hairCol:'#ffd43b',hairBoost:.3,size:1.2},
         {sec:6,name:'超サイヤ人2',short:'SS2',mult:1.8,col:'255,212,59',hair:'spiky',hairCol:'#ffd43b',hairBoost:.35,bolts:true,size:1.5},
         {sec:10,name:'超サイヤ人3',short:'SS3',mult:2.2,col:'255,200,40',hair:'long',hairCol:'#ffd43b',hairBoost:.4,bolts:true,size:1.9}],
  chk:(m)=>{const {sw,sm,p}=m;
   return vis(p,[13,14])&&dist(p[15],p[23])<.6*sw&&dist(p[16],p[24])<.6*sw&&Math.abs(p[13].x-sm.x)>.8*sw&&Math.abs(p[14].x-sm.x)>.8*sw}},
 {id:'ui',ps:'腕を斜め下に広げて静止',name:'身勝手の極意',
  tiers:[{sec:4,name:'身勝手の極意「兆し」',short:'兆',mult:1.8,col:'200,225,255',hair:'spiky',hairCol:'#e9ecef',hairBoost:.45,size:1.3},
         {sec:8,name:'身勝手の極意「極み」',short:'極',mult:2.5,col:'235,245,255',hair:'spiky',hairCol:'#f8f9fa',hairBoost:.6,size:1.7}],
  chk:(m)=>{const {sw,hm,p}=m,o15=Math.abs(p[15].x-hm.x)/sw,o16=Math.abs(p[16].x-hm.x)/sw;
   return p[15].x<hm.x&&p[16].x>hm.x&&o15>.8&&o15<1.8&&o16>.8&&o16<1.8&&p[15].y>hm.y-.2*sw&&p[16].y>hm.y-.2*sw&&m.sp15<.25&&m.sp16<.25}}
];
let formsOn=true,forms=[],holdLine=null;
document.getElementById('fm').onclick=()=>{formsOn=!formsOn;const b=document.getElementById('fm');b.textContent='⚡ 変身要素: '+(formsOn?'ON':'OFF');b.classList.toggle('on',formsOn)};
let hairMode='real';
const HM_LABEL={real:'リアル色変え',art:'イラスト',both:'リアル+イラスト'};
document.getElementById('hm').onclick=()=>{hairMode=hairMode==='real'?'art':hairMode==='art'?'both':'real';document.getElementById('hm').textContent='💇 髪: '+HM_LABEL[hairMode]};
let techSel='kame',curT=TECHNIQUES[0],ts={};
{const th=document.getElementById('techs');
 [...TECHNIQUES.map(t=>({id:t.id,name:t.name})),{id:'random',name:'🎲 ランダム'}].forEach(o=>{
  const b=document.createElement('button');b.textContent=o.name;b.className='tc'+(o.id===techSel?' on':'');
  b.onclick=()=>{techSel=o.id;th.querySelectorAll('.tc').forEach(x=>x.classList.toggle('on',x===b))};th.appendChild(b)})}

let nPlayers=2,useMic=false;
document.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{nPlayers=+b.dataset.n;document.querySelectorAll('.pc').forEach(x=>x.classList.toggle('on',x===b))});
$('mic').onclick=()=>{useMic=!useMic;$('mic').textContent='🎤 声の大きさもダメージに加える: '+(useMic?'ON':'OFF')};

/* 音 */
let ac=null;const AC=window.AudioContext||window.webkitAudioContext;
function beep(f,d,type){try{ac=ac||new AC();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.connect(g);g.connect(ac.destination);o.frequency.value=f;g.gain.value=.15;o.start();o.stop(ac.currentTime+(d||.15))}catch(e){}}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;speechSynthesis.speak(u)}
let analyser=null,micBuf=null,voiceLevel=0,voicePeak=0;
async function initMic(){const s=await navigator.mediaDevices.getUserMedia({audio:true});ac=ac||new AC();analyser=ac.createAnalyser();analyser.fftSize=1024;ac.createMediaStreamSource(s).connect(analyser);micBuf=new Uint8Array(analyser.fftSize)}
function readMic(){if(!analyser)return 0;analyser.getByteTimeDomainData(micBuf);let m=0;for(const v of micBuf)m=Math.max(m,Math.abs((v-128)/128));voiceLevel+=(m-voiceLevel)*.4;return voiceLevel}

/* 姿勢推定 */
let landmarker=null,lm=null,lastTs=-1,hairSeg=null,hairIdx=1;
async function init(){
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const model="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:"VIDEO",numPoses:2});
  try{landmarker=await mk("GPU")}catch(e){landmarker=await mk("CPU")}
  try{
    const HURL="https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite";
    const mkS=d=>ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:HURL,delegate:d},runningMode:"VIDEO",outputCategoryMask:false,outputConfidenceMasks:true});
    try{hairSeg=await mkS("GPU")}catch(e){hairSeg=await mkS("CPU")}
    const lb=hairSeg.getLabels?hairSeg.getLabels():[],k=lb.findIndex(x=>/hair/i.test(x));hairIdx=k>=0?k:1;
  }catch(e){hairSeg=null;console.warn('hair segmenter unavailable',e)}
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
  video.srcObject=stream;await video.play();
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function pickPerson(res){
  let best=null;
  for(const l of res.landmarks||[]){const w=Math.hypot(l[11].x-l[12].x,l[11].y-l[12].y);if(!best||w>best.w)best={l,w}}
  if(!best){lm=null;return}
  const cur=best.l.map(q=>({x:1-q.x,y:q.y,z:q.z,visibility:q.visibility}));
  lm=lm?cur.map((q,i)=>({x:lerp(lm[i].x,q.x,.55),y:lerp(lm[i].y,q.y,.55),z:lerp(lm[i].z,q.z,.55),visibility:q.visibility})):cur;
}
const vis=(p,ids)=>ids.every(i=>p[i].visibility>.5);
let hist=[];
function analyze(p,now){
  if(!vis(p,[11,12,15,16,23,24]))return {err:'腰から上が全部映る位置に立ってください'};
  const sw=dist(p[11],p[12]);if(sw<.04)return {err:'もう少しカメラに近づいてください'};
  const sm=mid(p[11],p[12]),hm=mid(p[23],p[24]),wm=mid(p[15],p[16]),d=dist(p[15],p[16]);
  hist.push({t:now,x:wm.x,y:wm.y,d,a:{x:p[15].x,y:p[15].y},b:{x:p[16].x,y:p[16].y}});
  while(hist.length&&now-hist[0].t>600)hist.shift();
  let ref=hist[0];for(const h of hist){if(now-h.t>=300)ref=h;else break}
  const m={p,sw,sm,hm,wm,nose:p[0],d,
    speed:Math.hypot(wm.x-ref.x,wm.y-ref.y)/sw,vy:(wm.y-ref.y)/sw,
    zFwd:((p[11].z+p[12].z)/2-(p[15].z+p[16].z)/2)/sw,
    sp15:Math.hypot(p[15].x-ref.a.x,p[15].y-ref.a.y)/sw,sp16:Math.hypot(p[16].x-ref.b.x,p[16].y-ref.b.y)/sw,
    spread:(d-ref.d)/sw};
  return Object.assign(m,curT.eval(m,ts));
}

/* ゲーム状態 */
let st='idle',round=0,turn=0,totals=[],eHP=0,eMax=0,eShown=0,eIdx=0,defeated=false,defeatAt=0;
let t0=0,turnStart=0,chargeT=0,maxCharge=0,charged=false,lastStance=0,qAvg=0;
let fireX=0,fireY=0,dmg=0,acc=0,parts=null,rank='C',bonus=0,vBoost=0,impacted=false,fireStr='';
let particles=[],floaters=[],shake=0,flash=0,lastNow=0,hint='';
const nowMs=()=>performance.now();
let formMult=1,formName='';
function newEnemy(){eMax=Math.round(700*nPlayers*(formsOn?1.6:1));eHP=eMax;eShown=eMax;defeated=false;defeatAt=0}
function startGame(){forms=Array.from({length:nPlayers},()=>({prog:{},tier:{}}));FORMS.forEach(F=>forms.forEach(f=>{f.prog[F.id]=0;f.tier[F.id]=-1}));totals=Array(nPlayers).fill(0);round=0;turn=0;eIdx=0;newEnemy();startTurn()}
function startTurn(){curT=techSel==='random'?TECHNIQUES[Math.floor(Math.random()*TECHNIQUES.length)]:TECHNIQUES.find(t=>t.id===techSel);ts={};holdLine=null;st='intro';t0=nowMs();chargeT=0;maxCharge=0;charged=false;qAvg=0;voicePeak=0;impacted=false;bonus=0;hist=[];beep(520,.2)}
function fire(a,forced){
  if(a&&a.err)a=null;
  const T=curT;

    const cx=110+(W-420)/2;
    txt((turn+1)+'P',cx,160,44,PCOLORS[turn]);
    txt(dmg>0?rank:'×',cx,250,130,rank==='S'?'#ffe066':rank==='A'?'#8ce99a':'#fff');
    txt(dmg>0?'ダメージ '+dmg:'不発…',cx,330,52,'#fff');
    if(formMult>1)txtFit('変身 ×'+formMult+'  '+formName,cx,366,30,'#ffe066',W-460);
    if(vBoost>0)txt('声ボーナス +'+Math.round(vBoost*25)+'%',cx,398,28,'#ffa94d');
    if(bonus)txt('ラストヒット +'+bonus,cx,428,32,'#ff922b');
    let y=466;
    for(const k in parts){
      txt(k,cx-240,y,22,'#fff','left');
      ctx.fillStyle='#343a40';ctx.fillRect(cx-150,y-9,300,18);
      ctx.fillStyle='#4dabf7';ctx.fillRect(cx-150,y-9,300*clamp(parts[k],0,1),18);
      y+=34;
    }
    if(now-t0>=RESULT_MS)advance();
  }
  /* 共通HUD */
  if(st!=='idle'&&st!=='end'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,TB());
    txt('ROUND '+(round+1)+'/'+ROUNDS,W/2,TB()/2,34,'#fff');txt(curT.name,W-20,TB()/2,28,curT.col.glow,'right');
    drawScores();
  }
  /* エフェクト */
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.02;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.globalAlpha=1}
  floaters=floaters.filter(f=>f.life>0);
  for(const f of floaters){f.y-=1.2;f.life-=.016;ctx.globalAlpha=clamp(f.life,0,1);txt(f.t,f.x,f.y,64,f.c);ctx.globalAlpha=1}
  shake*=.88;if(shake<.3)shake=0;flash*=.9;if(flash<.02)flash=0;
}
function TB(){return 64}
function drawScores(){
  const x=14;let y=TB()+14;
  ctx.fillStyle='rgba(0,0,0,.55)';rr(x-6,y-6,270,nPlayers*34+12,12);ctx.fill();
  for(let i=0;i<nPlayers;i++){const ft=formsOn?formNow(i):null;txt((i===turn?'▶':'  ')+(i+1)+'P  '+totals[i]+(ft?' ['+ft.short+']':''),x,y+i*34+14,26,PCOLORS[i],'left')}
}

btn.addEventListener('click',async()=>{
  try{ac=ac||new AC();ac.resume()}catch(e){}
  if(landmarker){overlay.style.display='none';startGame();return}
  btn.disabled=true;btn.textContent='読み込み中…';
  try{
    await init();
    if(useMic){try{await initMic()}catch(e){useMic=false}}
    overlay.style.display='none';startGame();
  }catch(e){btn.disabled=false;btn.textContent='もう一度試す';
    msg.textContent='起動できませんでした。カメラの許可とネット接続を確認してください。('+(e&&e.name?e.name:'error')+')'}
});
addEventListener('keydown',e=>{if(e.code==='Space'&&st==='charge'){e.preventDefault();fire(lm?analyze(lm,nowMs()):null,true)}});
$('fs').onclick=()=>{const w=document.querySelector('.wrap');const fe=document.fullscreenElement||document.webkitFullscreenElement;
  if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const f=w.requestFullscreen||w.webkitRequestFullscreen;if(f)f.call(w)}};
requestAnimationFrame(loop);
</script>
